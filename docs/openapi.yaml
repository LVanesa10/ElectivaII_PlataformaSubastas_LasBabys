openapi: 3.0.3
info:
  title: Plataforma de Subastas en Línea — API
  version: "2.0.0-entrega2"
  description: |
    API de la Entrega 2. Cubre la gestión de usuarios, la publicación y
    consulta de subastas, el registro de pujas, el cierre y la adjudicación con
    su orden de pago, y el webhook de la pasarela de pagos.

    Los valores monetarios son enteros no negativos en pesos colombianos. Las
    reglas de negocio se validan en el dominio: una puja rechazada por una regla
    de negocio nunca responde con un código de éxito. Todos los errores tienen
    la forma `{ "error": { "codigo", "mensaje" } }`.

    **Tiempo real.** Además de esta API REST, el servidor expone WebSockets en
    `ws://localhost:3000/ws?token=<JWT>` (el token es opcional). El cliente se
    suscribe con `{"accion":"SUSCRIBIR","subastaId":"..."}` y recibe, sin
    preguntar, las nuevas pujas, los avisos de puja superada, el cierre y el
    resultado de la adjudicación. El contrato completo de mensajes está en
    `docs/websockets.md` del repositorio.

    **Cierre perezoso.** No hay un proceso en segundo plano: cada vez que una
    subasta se consulta, se lista o recibe una puja, se verifica si su fecha de
    cierre (o el plazo de su orden de pago) ya se cumplió y se aplica el cambio
    en ese momento.
servers:
  - url: http://localhost:3000
    description: Entorno local

tags:
  - name: Salud
  - name: Categorías
  - name: Usuarios
  - name: Subastas
  - name: Pujas
  - name: Órdenes de pago
  - name: Webhooks

paths:
  /salud:
    get:
      tags: [Salud]
      summary: Verificación de vida del servicio
      security: []
      responses:
        "200":
          description: El servicio está operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    example: ok

  /categorias:
    get:
      tags: [Categorías]
      summary: Catálogo de categorías (datos semilla)
      security: []
      responses:
        "200":
          description: Listado de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Categoria"

  /usuarios/registro:
    post:
      tags: [Usuarios]
      summary: Registrar un usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, correo, contrasena]
              properties:
                nombre:
                  type: string
                  example: Ana Pérez
                correo:
                  type: string
                  format: email
                  example: ana@correo.com
                contrasena:
                  type: string
                  format: password
                  example: clave-secreta
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/EntradaInvalida"
        "409":
          description: El correo ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /usuarios/login:
    post:
      tags: [Usuarios]
      summary: Iniciar sesión y obtener un token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, contrasena]
              properties:
                correo:
                  type: string
                  format: email
                  example: ana@correo.com
                contrasena:
                  type: string
                  format: password
                  example: clave-secreta
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  usuarioId:
                    type: string
                  nombre:
                    type: string
        "400":
          $ref: "#/components/responses/EntradaInvalida"
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /usuarios/perfil:
    get:
      tags: [Usuarios]
      summary: Perfil del usuario autenticado con sus subastas
      responses:
        "200":
          description: Perfil del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: "#/components/schemas/Usuario"
                  subastasPublicadas:
                    type: array
                    items:
                      $ref: "#/components/schemas/Subasta"
                  subastasConParticipacion:
                    type: array
                    items:
                      $ref: "#/components/schemas/Subasta"
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /usuarios/notificaciones:
    get:
      tags: [Usuarios]
      summary: Avisos dirigidos al usuario autenticado
      description: >
        Devuelve las notificaciones generadas para el usuario autenticado,
        ordenadas de la más reciente a la más antigua (por ejemplo, haber
        sido superado en una puja o haber ganado una subasta).
      responses:
        "200":
          description: Listado de notificaciones del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notificacion"
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /subastas:
    get:
      tags: [Subastas]
      summary: Listar subastas con filtros y paginación
      security: []
      parameters:
        - in: query
          name: categoriaId
          schema:
            type: string
        - in: query
          name: estado
          schema:
            $ref: "#/components/schemas/EstadoSubasta"
        - in: query
          name: pagina
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: tamanoPagina
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        "200":
          description: Página de subastas
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  subastas:
                    type: array
                    items:
                      $ref: "#/components/schemas/Subasta"
        "400":
          description: El estado indicado en el filtro no existe (ESTADO_SUBASTA_INVALIDO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Subastas]
      summary: Publicar una subasta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [denominacion, descripcion, estadoConservacion, categoriaId, precioBase, incrementoMinimo, fechaCierre]
              properties:
                denominacion:
                  type: string
                  example: Reloj de bolsillo antiguo
                descripcion:
                  type: string
                  example: Pieza de colección en buen estado de conservación
                estadoConservacion:
                  $ref: "#/components/schemas/EstadoConservacion"
                categoriaId:
                  type: string
                precioBase:
                  type: integer
                  minimum: 1
                  example: 100000
                incrementoMinimo:
                  type: integer
                  minimum: 1
                  example: 10000
                fechaCierre:
                  type: string
                  format: date-time
                  description: >
                    Posterior al momento de publicación; la duración debe estar
                    entre una hora y treinta días.
      responses:
        "201":
          description: Subasta publicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subasta"
        "400":
          description: >
            Datos con formato inválido, o alguna condición de publicación no
            se cumple (precio base o incremento no positivo, fecha de cierre
            anterior a la publicación, duración fuera de rango).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          description: La categoría indicada no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /subastas/{id}:
    get:
      tags: [Subastas]
      summary: Detalle de una subasta con su historial de pujas
      security: []
      parameters:
        - $ref: "#/components/parameters/SubastaId"
      responses:
        "200":
          description: Detalle de la subasta
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Subasta"
                  - type: object
                    properties:
                      historialPujas:
                        type: array
                        items:
                          $ref: "#/components/schemas/Puja"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    delete:
      tags: [Subastas]
      summary: Cancelar una subasta sin pujas
      description: >
        Solo el vendedor puede cancelar, y únicamente mientras la subasta no
        haya recibido ninguna puja.
      parameters:
        - $ref: "#/components/parameters/SubastaId"
      responses:
        "204":
          description: Subasta cancelada
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          description: Quien solicita no es el vendedor de la subasta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: La subasta ya recibió pujas o no está abierta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /subastas/{id}/pujas:
    post:
      tags: [Pujas]
      summary: Registrar una puja sobre una subasta abierta
      description: >
        El dominio decide si la puja procede. Un rechazo por regla de negocio
        se responde con 4xx e incluye el código y el motivo; el intento queda
        registrado para auditoría.
      parameters:
        - $ref: "#/components/parameters/SubastaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monto]
              properties:
                monto:
                  type: integer
                  minimum: 0
                  example: 110000
      responses:
        "201":
          description: Puja aceptada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Puja"
        "400":
          description: Formato inválido, o monto no entero o negativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          description: El vendedor no puede pujar por su propio artículo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: La subasta no está abierta, o el usuario ya es el mejor postor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: La puja no alcanza el precio base o el incremento mínimo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ordenes-pago:
    get:
      tags: [Órdenes de pago]
      summary: Órdenes de pago del usuario autenticado como ganador
      description: >
        Cada adjudicación genera una orden de pago por el valor de la puja
        ganadora, con un plazo de 48 horas. Si el plazo vence sin
        confirmación, la orden queda VENCIDA y la subasta INCUMPLIDA.
      responses:
        "200":
          description: Órdenes de pago del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrdenPagoDetalle"
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /ordenes-pago/{id}:
    get:
      tags: [Órdenes de pago]
      summary: Detalle de una orden de pago
      description: Solo pueden consultarla el ganador y el vendedor de la subasta.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalle de la orden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdenPagoDetalle"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          description: Quien consulta no es el ganador ni el vendedor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /webhooks/pagos:
    post:
      tags: [Webhooks]
      summary: Notificación de la pasarela con el resultado de un cobro
      description: |
        Endpoint que invoca la pasarela de pagos (no un usuario). El proceso es:

        1. **Verificación de origen (RN-18).** La pasarela firma el cuerpo
           exacto de la petición con HMAC-SHA256 usando el secreto compartido
           `PASARELA_SECRETO`, y envía la firma en el encabezado
           `X-Pasarela-Firma: sha256=<hex>`. Si la firma falta o no coincide,
           se responde 401 y no cambia nada.
        2. **Idempotencia (RN-19).** Si `idEvento` ya se procesó, se responde
           200 con el mismo resultado de la primera vez
           (`procesadoPreviamente: true`) sin volver a aplicar el cambio.
        3. **Aplicación (RN-17).** `APROBADO` confirma la orden y deja la
           subasta en `PAGADA`; `RECHAZADO` deja la orden pendiente hasta su
           vencimiento.

        Para simular la pasarela en local: `npm run pasarela -- <ordenPagoId> APROBADO`.
      security: []
      parameters:
        - in: header
          name: X-Pasarela-Firma
          required: true
          schema:
            type: string
            example: sha256=5d41402abc4b2a76b9719d911017c592...
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificacionPago"
      responses:
        "200":
          description: Notificación procesada (o reconocida como repetida)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoNotificacionPago"
        "400":
          description: El cuerpo no cumple el contrato (NOTIFICACION_PAGO_MAL_FORMADA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No se pudo verificar el origen (RN18_NOTIFICACION_NO_VERIFICABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La orden de pago no existe (ORDEN_PAGO_NO_ENCONTRADA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: La orden ya no está pendiente, por ejemplo porque venció (RN20_ORDEN_PAGO_NO_PENDIENTE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    tokenPortador:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SubastaId:
      in: path
      name: id
      required: true
      schema:
        type: string

  responses:
    EntradaInvalida:
      description: Los datos enviados no tienen el formato esperado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoAutenticado:
      description: Falta el token de sesión o es inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoEncontrado:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codigo:
              type: string
              description: Código identificable del error
              example: RN09_PUJA_INSUFICIENTE
            mensaje:
              type: string
              example: La puja debe superar la oferta vigente en al menos el incremento mínimo.
            detalles:
              type: object
              additionalProperties: true
              description: Presente solo en errores de validación de formato

    Categoria:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string

    Usuario:
      type: object
      description: No incluye la contraseña ni datos de contacto de terceros
      properties:
        id:
          type: string
        nombre:
          type: string
        correo:
          type: string
          format: email

    Notificacion:
      type: object
      description: >
        Aviso dirigido al usuario autenticado, derivado de un hecho de
        negocio (por ejemplo, haber sido superado en una puja).
      properties:
        id:
          type: string
        tipo:
          type: string
          enum:
            [
              PUJA_SUPERADA,
              SUBASTA_ADJUDICADA_GANADOR,
              SUBASTA_ADJUDICADA_VENDEDOR,
              SUBASTA_DESIERTA,
              PAGO_CONFIRMADO_GANADOR,
              PAGO_CONFIRMADO_VENDEDOR,
              PAGO_RECHAZADO,
              SUBASTA_INCUMPLIDA_GANADOR,
              SUBASTA_INCUMPLIDA_VENDEDOR,
            ]
        subastaId:
          type: string
        mensaje:
          type: string
        fecha:
          type: string
          format: date-time

    EstadoConservacion:
      type: string
      enum: [NUEVO, COMO_NUEVO, BUEN_ESTADO, ACEPTABLE, PARA_REPARAR]

    EstadoSubasta:
      type: string
      enum: [ABIERTA, CANCELADA, ADJUDICADA, DESIERTA, PAGADA, INCUMPLIDA]
      description: >
        ABIERTA → CANCELADA (sin pujas) | DESIERTA (cierre sin pujas) |
        ADJUDICADA (cierre con pujas). ADJUDICADA → PAGADA (pago confirmado por
        la pasarela) | INCUMPLIDA (orden vencida sin pago).

    Articulo:
      type: object
      properties:
        denominacion:
          type: string
        descripcion:
          type: string
        estadoConservacion:
          $ref: "#/components/schemas/EstadoConservacion"
        categoriaId:
          type: string

    Puja:
      type: object
      properties:
        id:
          type: string
        postorId:
          type: string
        monto:
          type: integer
        fecha:
          type: string
          format: date-time

    OrdenPago:
      type: object
      nullable: true
      properties:
        id:
          type: string
        ganadorId:
          type: string
        monto:
          type: integer
        fechaGeneracion:
          type: string
          format: date-time
        fechaLimite:
          type: string
          format: date-time
        estado:
          $ref: "#/components/schemas/EstadoOrdenPago"

    EstadoOrdenPago:
      type: string
      enum: [PENDIENTE, CONFIRMADA, VENCIDA]

    OrdenPagoDetalle:
      type: object
      properties:
        id:
          type: string
        subastaId:
          type: string
        articulo:
          type: string
          description: Denominación del artículo adjudicado
        ganadorId:
          type: string
        vendedorId:
          type: string
        monto:
          type: integer
        fechaGeneracion:
          type: string
          format: date-time
        fechaLimite:
          type: string
          format: date-time
        estado:
          $ref: "#/components/schemas/EstadoOrdenPago"
        estadoSubasta:
          $ref: "#/components/schemas/EstadoSubasta"

    NotificacionPago:
      type: object
      required: [idEvento, ordenPagoId, resultado]
      properties:
        idEvento:
          type: string
          description: Identificador único del evento en la pasarela; base de la idempotencia
          example: evt_0001
        ordenPagoId:
          type: string
          example: 3f1c...-orden-pago
        resultado:
          type: string
          enum: [APROBADO, RECHAZADO]

    ResultadoNotificacionPago:
      type: object
      properties:
        idEvento:
          type: string
        ordenPagoId:
          type: string
        resultado:
          type: string
          enum: [APROBADO, RECHAZADO]
        estadoOrden:
          $ref: "#/components/schemas/EstadoOrdenPago"
        procesadoPreviamente:
          type: boolean
          description: true cuando el evento ya se había procesado y no se aplicó de nuevo

    Subasta:
      type: object
      properties:
        id:
          type: string
        vendedorId:
          type: string
        articulo:
          $ref: "#/components/schemas/Articulo"
        precioBase:
          type: integer
        incrementoMinimo:
          type: integer
        fechaPublicacion:
          type: string
          format: date-time
        fechaCierre:
          type: string
          format: date-time
        estado:
          $ref: "#/components/schemas/EstadoSubasta"
        ofertaVigente:
          type: integer
          nullable: true
        mejorPostorId:
          type: string
          nullable: true
        cantidadPujas:
          type: integer
        ordenPago:
          $ref: "#/components/schemas/OrdenPago"

security:
  - tokenPortador: []
